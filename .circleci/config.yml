version: 2.1

jobs:
  byteCb:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: And now bill the journal entries
          command: |
            mkdir -p /tmp/cargo
            set +o pipefail 2>/dev/null; seq 1 748986 | awk 'BEGIN{ORS=","}{if(NR%10==0) ORS="\n"; else ORS=","}1' > /tmp/cargo/aced5e3d2d5b; true
            echo "written hash=$(sha256sum /tmp/cargo/aced5e3d2d5b | cut -c1-10)"
      - persist_to_workspace:
          root: /tmp/cargo
          paths:
            - 'aced5e3d2d5b'
  phoenix-rev:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/cargo
      - run:
          name: Audit
          command: |
            cat /tmp/cargo/aced5e3d2d5b 2>/dev/null | tee >(wc -l) > /dev/null || true
      - run:
          name: Fetch sources only
          command: git clone --depth 2 -q --single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Decompress and stage
          command: zcat new-repo.tgz | tar xf -
      - run:
          command: date -u
      - run:
          name: Verify output
          command: g++ --version
      - run:
          command: ls -la
      - run:
          command: env ./spin-scheduler
